[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrimony-bot"
version = "0.1.0"
description = "Matrimony - a MarriageBot-style family-tree Discord bot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["discord.py>=2.4.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["matrimony*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "SIM", "B", "UP"]
ignore = ["E501"]
